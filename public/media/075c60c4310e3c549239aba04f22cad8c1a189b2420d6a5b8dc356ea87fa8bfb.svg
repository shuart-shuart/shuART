<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <style>
      .serif { font-family: 'Newsreader', Georgia, 'Songti SC', serif; }
      .mono { font-family: 'IBM Plex Mono', Menlo, Monaco, monospace; font-size: 11px; fill: #666666; letter-spacing: 0.05em; }
      .title { font-family: 'Newsreader', Georgia, 'Songti SC', serif; font-size: 26px; fill: #111111; font-weight: normal; }
      .heading { font-family: 'Newsreader', Georgia, 'Songti SC', serif; font-size: 19px; fill: #222222; font-style: italic; }
      .body { font-family: 'Source Sans 3', -apple-system, sans-serif; font-size: 14px; fill: #333333; line-height: 1.8; }
      .annotation { font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 11px; fill: #888888; font-style: italic; }
    </style>
  </defs>

  <!-- Page Background with subtle paper tone -->
  <rect width="700" height="900" fill="#fcfbf9" stroke="#e5e3dd" stroke-width="1.5" />
  
  

  <!-- Header Folio -->
  <text x="60" y="55" class="mono">PART TIME BOOK CLUB · ISSUE 01</text>
  <text x="640" y="55" text-anchor="end" class="mono">p. 5</text>
  <line x1="60" y1="70" x2="640" y2="70" stroke="#eeeeee" stroke-width="1" />

  <!-- Main Content -->
  <text x="60" y="130" class="title">Marginalia & Reader Stamps</text>
  
  <text x="60" y="180" class="body">Marginal inscriptions recorded during November meeting:</text><text x="60" y="212" class="body">“This sentence has been read by three previous people; each left an indent in the margin.”</text><text x="60" y="244" class="body">“A book left unread in a library decays differently than one handled daily.”</text><text x="60" y="276" class="body">Library collection stamp: 述书 / SS Archive — Specimen 014.</text>

  
  <rect x="60" y="770" width="580" height="45" fill="#f5f3ee" stroke="#e8e6df" />
  <text x="75" y="798" class="annotation">Reader marginalia transcript verified against original library specimens.</text>
  

  <!-- Footer Folio -->
  <line x1="60" y1="840" x2="640" y2="840" stroke="#eeeeee" stroke-width="1" />
  <text x="350" y="865" text-anchor="middle" class="mono">— p. 5 —</text>
</svg>