<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .serif { font-family: 'Newsreader', Georgia, 'Songti SC', serif; }
      .mono { font-family: 'IBM Plex Mono', Menlo, Monaco, monospace; font-size: 11px; fill: #666666; letter-spacing: 0.05em; }
      .title { font-family: 'Newsreader', Georgia, 'Songti SC', serif; font-size: 26px; fill: #111111; font-weight: normal; }
      .heading { font-family: 'Newsreader', Georgia, 'Songti SC', serif; font-size: 19px; fill: #222222; font-style: italic; }
      .body { font-family: 'Source Sans 3', -apple-system, sans-serif; font-size: 14px; fill: #333333; line-height: 1.8; }
      .annotation { font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 11px; fill: #888888; font-style: italic; }
    </style>
  </defs>

  <!-- Page Background with subtle paper tone -->
  <rect width="1200" height="900" fill="#fcfbf9" stroke="#e5e3dd" stroke-width="1.5" />
  
  <line x1="600" y1="0" x2="600" y2="900" stroke="#e0ded8" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Header Folio -->
  <text x="60" y="55" class="mono">述书: FACSIMILE OF LIBRARY INSCRIPTIONS · PRE-COMPOSED SPREAD 04</text>
  <text x="1140" y="55" text-anchor="end" class="mono">pp. 8–9 (Spread 4)</text>
  <line x1="60" y1="70" x2="1140" y2="70" stroke="#eeeeee" stroke-width="1" />

  <!-- Main Content -->
  <text x="60" y="130" class="title">Spread 04: Library Stamp Registry & Colophon</text>
  
  <text x="60" y="180" class="body">[Left Page: pp. 8] Catalog of Archival Rubber Stamps & Deaccession Marks</text><text x="60" y="212" class="body">Red cinnabar paste stamps, purple aniline deaccession markings, and classification codes.</text><text x="60" y="244" class="body">Each mark represents an institutional crossing point from public collection to discard.</text><text x="60" y="276" class="body">—</text><text x="60" y="308" class="body">[Right Page: pp. 9] Printer's Colophon & Edition Record</text><text x="60" y="340" class="body">Bound in exposed thread binding with untrimmed fore-edges.</text><text x="60" y="372" class="body">Published as part of 述书 / SS: between books & libraries · Hong Shu-ying 方舒颖.</text>

  
  <rect x="60" y="770" width="1080" height="45" fill="#f5f3ee" stroke="#e8e6df" />
  <text x="75" y="798" class="annotation">Spread 04 of 04 · Final colophon spread with library provenance register.</text>
  

  <!-- Footer Folio -->
  <line x1="60" y1="840" x2="1140" y2="840" stroke="#eeeeee" stroke-width="1" />
  <text x="600" y="865" text-anchor="middle" class="mono">— pp. 8–9 (Spread 4) —</text>
</svg>